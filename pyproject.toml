[project]
name = "docrag"
version = "0.1.0"
description = "Self-hosted hybrid RAG over PDF documents."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stavros Georgousis" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Needed by docrag.file_ops.download and docrag.datasets: downloading the
# benchmark.
datasets = [
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    # The package itself with its extras, so every module can be checked.
    "docrag[datasets]",
    "mypy>=2.4",
    "pylint>=4.1",
    "pytest>=9.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17",
    "types-requests>=2.33.0",
    "types-tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# Keeps local, CI, and image builds on the same uv minor as the build backend.
[tool.uv]
required-version = ">=0.13.8,<0.14.0"

# Formatting, import order, and docstring shape. General linting is pylint's
# job (see .pylintrc), so no other ruff rule sets are enabled.
[tool.ruff]
line-length = 80
indent-width = 4
src = ["src", "tests", "scripts"]
# marimo generates and formats its notebook files itself.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# The Google guide does not require docstrings on tests.
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

# Branch coverage of the package. Scripts and notebooks are not measured.
[tool.coverage.run]
branch = true
source_pkgs = ["docrag"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
